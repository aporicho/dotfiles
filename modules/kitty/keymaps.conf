# ============================================
# Kitty 高级快捷键配置
# ============================================

# === 窗口管理 ===
# 新窗口/标签继承当前目录
map cmd+enter new_window_with_cwd
map cmd+t new_tab_with_cwd
map cmd+n new_os_window_with_cwd

# 关闭窗口/标签
map cmd+w close_window
map cmd+shift+w close_tab

# 窗口导航
map cmd+left neighboring_window left
map cmd+right neighboring_window right
map cmd+up neighboring_window up
map cmd+down neighboring_window down

# 窗口分割
# Cmd+D: 垂直分割（左右） | Cmd+Shift+D: 水平分割（上下）
map cmd+d launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current

# 窗口大小调整
map cmd+ctrl+left resize_window narrower 2
map cmd+ctrl+right resize_window wider 2
map cmd+ctrl+up resize_window taller 2
map cmd+ctrl+down resize_window shorter 2

# === 标签管理 ===
# 标签导航
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# 切换到上一个标签页
map ctrl+tab goto_tab -1

# 标签移动
map cmd+shift+left move_tab_backward
map cmd+shift+right move_tab_forward

# === 布局管理 ===
# 切换布局
map cmd+l next_layout
map cmd+shift+l last_used_layout

# 快速缩放窗口 (切换到 stack 布局)
map cmd+z toggle_layout stack

# 切换全屏模式
map ctrl+cmd+f toggle_fullscreen

# === 滚动和历史 ===
# 滚动
map cmd+shift+up scroll_line_up
map cmd+shift+down scroll_line_down
map cmd+shift+page_up scroll_page_up
map cmd+shift+page_down scroll_page_down
map cmd+shift+home scroll_home
map cmd+shift+end scroll_end

# 在编辑器中查看滚动历史
map cmd+h show_scrollback

# 跳转到上一个/下一个提示符 (需要 shell 集成)
map cmd+shift+z scroll_to_prompt -1
map cmd+shift+x scroll_to_prompt 1

# === 清屏和重置 ===
# 清除到光标 (需要 shell 集成)
map cmd+k clear_terminal to_cursor active

# 清除整个终端
map cmd+shift+k clear_terminal reset active

# 清除滚动历史
map cmd+ctrl+k clear_terminal scrollback active

# === 文本操作 ===
# 复制/粘贴
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard
map cmd+shift+v paste_from_selection

# === 搜索 ===
# 在滚动历史中搜索
map cmd+f show_scrollback

# === 调试和配置 ===
# 重新加载配置
map cmd+shift+r load_config_file

# 打开配置文件 (需要外部编辑器)
# map cmd+, launch --type=os-window nvim ~/.config/kitty/kitty.conf

# === 字体大小调整 ===
map cmd+equal change_font_size all +2.0
map cmd+minus change_font_size all -2.0
map cmd+0 change_font_size all 0

# === 透明度调整 ===
map cmd+ctrl+equal set_background_opacity +0.05
map cmd+ctrl+minus set_background_opacity -0.05
map cmd+ctrl+0 set_background_opacity 1.0

# === 连字切换 ===
map alt+1 disable_ligatures_in active always
map alt+2 disable_ligatures_in active never
map alt+3 disable_ligatures_in active cursor

# === tmux 前缀键 ===
# Cmd+a 发送 Ctrl+a 给 tmux
map cmd+a send_key ctrl+a
