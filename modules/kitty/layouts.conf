# ============================================
# Kitty 窗口布局和多窗口管理
# ============================================

# === 布局设置 ===
# 启用的布局模式
enabled_layouts splits,stack,tall,fat,grid,horizontal,vertical

# 记住每个标签的布局
remember_window_size yes

# === 窗口设置 ===
# 窗口内边距 (已在 style.conf 中设置，这里注释掉避免重复)
# window_padding_width 8

# 单窗口模式下的特殊内边距
single_window_padding_width -1

# 窗口边框 (已在 style.conf 中设置)
# window_border_width 1.0pt

# === 标签栏增强 ===
# 标签栏位置 (已在 style.conf 中设置)
# tab_bar_edge top

# 标签标题模板 - 添加活动指示器 (已在 style.conf 中设置)
# tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}: {title}"

# 活动符号
tab_activity_symbol 🔔
bell_on_tab " "

# === 新窗口/标签行为 ===
# 新标签/窗口继承当前工作目录
# (通过快捷键实现，见 keymaps.conf)

# === 会话管理 ===
# 启动会话 (可选，留空则使用默认)
# startup_session ~/.config/kitty/sessions/default.session

# 会话配置文件示例路径:
# ~/.config/kitty/sessions/work.session
# ~/.config/kitty/sessions/dev.session
# ~/.config/kitty/sessions/personal.session
