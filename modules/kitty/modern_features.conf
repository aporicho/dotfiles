# ============================================
# Kitty 现代功能配置 (v0.43+)
# ============================================

# === 光标轨迹 ===
# 注意: cursor_trail 功能在当前版本可能不可用
# 已在 Kitty 较新版本中移除或更改

# === 桌面通知 (v0.36+) ===
# 命令完成时发送通知
# notify_on_cmd_finish invisible 10.0

# 通知选项:
# - invisible: 窗口不可见时通知
# - unfocused: 窗口失焦时通知
# - always: 总是通知

# === 图形协议支持 ===
# Kitty 图形协议 (用于在终端显示图像)
# 已默认启用

# === 半透明标题栏 (v0.43, macOS) ===
# 当 background_opacity < 1 时，标题栏也半透明
macos_titlebar_color background

# === URL 检测增强 ===
# 检测和点击 URL
detect_urls yes

# URL 样式 (已在 style.conf 中设置)
# url_style curly

# 点击 URL 时使用的程序
# url_launcher default

# === 剪贴板增强 ===
# 选中文本自动复制到剪贴板 (已在 style.conf 中设置)
# copy_on_select yes

# 粘贴时确认
# clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

# === Unicode 输入 ===
# 使用 Cmd+Ctrl+Space 输入 Unicode 字符
# map cmd+ctrl+space show_unicode_input
