# ============================================
# Shell 集成配置
# ============================================

# 启用 shell 集成 (支持 zsh, fish, bash)
shell_integration enabled

# Shell 集成功能:
# - 跳转到上一个/下一个命令提示符
# - 在 less 中查看上一条命令的输出
# - 智能光标形状 (提示符处为 beam)
# - 复制命令输出
# - 当前工作目录跟踪

# 光标形状控制
# shell_integration no-cursor  # 如果不想要自动光标形状更改

# 在命令完成时通知 (可选)
# notify_on_cmd_finish invisible 30.0 notify
