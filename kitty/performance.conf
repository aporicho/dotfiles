# ============================================
# Kitty 性能优化配置
# 最后更新: 2025-10
# ============================================

# === 核心性能设置 ===
# 输入延迟优化 (默认 3ms，设为 0 获得最低延迟)
input_delay 0

# 重绘延迟优化 (默认 10ms，降低到 2ms)
repaint_delay 2

# 同步到显示器刷新率 (关闭以降低延迟，但可能出现轻微撕裂)
# 注意: 高速鼠标/键盘可能感知到轻微延迟
sync_to_monitor yes

# === 滚动性能 ===
# 滚动历史行数 (内存按需分配)
scrollback_lines 10000

# Pager 额外历史大小 (MB) - 用于在 less 中查看大量历史
scrollback_pager_history_size 50

# 窗口放大时用滚动历史填充空白区域
scrollback_fill_enlarged_window yes

# === 渲染优化 ===
# 使用 GPU 缓存字形，减少 CPU 负载
# Kitty 默认启用，无需额外配置

# === macOS 特定优化 ===
# 颜色空间 (Display P3 提供更鲜艳的色彩)
macos_colorspace displayp3

# 字体渲染优化
# 注意: legacy 模式会让颜色变暗淡，platform 模式（默认）颜色更鲜艳
# text_composition_strategy legacy  # 细线条但颜色暗淡
# text_composition_strategy platform  # 默认，颜色鲜艳（推荐）

# 字体加粗调整 (0.1 提升可读性，不过度粗化)
macos_thicken_font 0.1

# === 响应性优化 ===
# 快速关闭窗口确认
confirm_os_window_close 0

# 鼠标隐藏时间 (秒)
mouse_hide_wait 2.0

# === 终端类型 ===
# 使用 xterm-kitty 获得完整现代终端功能
term xterm-kitty
