# ============================================
# Kitty 通用样式配置
# 包含：字体、窗口、标签栏、性能等设置
# 可搭配任意配色方案使用
# ============================================

# ── 引入配色方案 ──────────────────────────
# 默认使用 Tokyo Night 配色，可替换为其他配色文件
include tokyo-night-colors.conf

# ── 终端类型设置 ──────────────────────────
# 使用 kitty 专用终端类型，支持真彩色和所有现代终端功能
term xterm-kitty


# ── 字体配置 ──────────────────────────────
# 使用 Nerd Font 字体，完整支持图标和编程连字
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        18.0

# 启用编程连字（将 => != >= 等符号美化显示）
disable_ligatures never


# ── 光标样式 ──────────────────────────────
# 竖线光标（可选：block, beam, underline）
cursor_shape beam
# 光标粗细
cursor_beam_thickness 1.5
# 光标闪烁间隔（秒）
cursor_blink_interval 0.5
# 15秒无操作后停止闪烁
cursor_stop_blinking_after 15.0


# ── 窗口布局设置 ──────────────────────────
# 窗口内边距（像素）
window_padding_width 8
# 窗口外边距
window_margin_width 0
# 单窗口时的外边距
single_window_margin_width 0
# 窗口边框宽度
window_border_width 1pt
# 只绘制必要的边框
draw_minimal_borders yes

# macOS 窗口装饰：只隐藏标题栏，保留圆角
hide_window_decorations titlebar-only
# 关闭窗口时不确认
confirm_os_window_close 0

# 记住窗口大小和位置
remember_window_size no
# 初始窗口大小 - 设置为非常大的值以填充屏幕
# 使用字符单位(c)而不是像素，Kitty 会自动计算最大尺寸
initial_window_width 999c
initial_window_height 999c


# ── 标签栏样式 ────────────────────────────
# 标签栏位置（top/bottom）
tab_bar_edge top
# 标签栏样式（powerline 风格）
tab_bar_style hidden
# Powerline 样式（round=圆角）
tab_powerline_style round
# 最少显示标签数量
tab_bar_min_tabs 1
# 标签栏对齐方式
tab_bar_align left

# 标签标题模板（显示索引号和标题）
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}: {title}"

# 激活标签字体样式
active_tab_font_style bold
# 非激活标签字体样式
inactive_tab_font_style normal


# ── URL 链接样式 ──────────────────────────
# URL 下划线样式（curly=波浪线）
# 可选：none, straight, double, curly, dotted, dashed
url_style curly


# ── 鼠标和剪贴板 ──────────────────────────
# 鼠标无操作 2 秒后隐藏
mouse_hide_wait 2.0
# 选中文本自动复制到剪贴板
copy_on_select yes
# 智能删除行尾空格
strip_trailing_spaces smart


# ── 滚动和历史记录 ────────────────────────
# 回滚缓冲区行数（历史记录）
scrollback_lines 10000


# ── 终端提示音 ────────────────────────────
# 禁用音频提示音
enable_audio_bell no
# 禁用视觉提示
visual_bell_duration 0.0
# 终端响铃时不闪烁窗口
window_alert_on_bell no


# ── macOS 专属设置 ────────────────────────
# 标题栏颜色跟随背景色
macos_titlebar_color background
# Option 键作为 Alt 键
macos_option_as_alt yes
# 关闭最后窗口时退出应用
macos_quit_when_last_window_closed yes
# 字体加粗（提升可读性）
macos_thicken_font 0.1
# 颜色空间设置（displayp3 提供更鲜艳的颜色）
macos_colorspace displayp3


# ── 性能优化 ──────────────────────────────
# 屏幕重绘延迟（毫秒）
repaint_delay 10
# 输入处理延迟（毫秒）
input_delay 3
# 同步到显示器刷新率，防止撕裂
sync_to_monitor yes

# ============================================
# 通用样式配置结束
# ============================================
